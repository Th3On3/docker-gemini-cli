services:
  gemini-cli-global:
    image: gemini-cli:latest
    container_name: gemini-cli-global
    build:
      context: ./gemini-cli
      dockerfile: Dockerfile
    working_dir: /workspace
    entrypoint: []
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    volumes:
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ~/.gemini:/home/node/.gemini:cached
      - .:/workspace:cached
    env_file:
      - ~/.env.gemini
    profiles:
      - global

  gemini-cli-local:
    image: gemini-cli:latest
    container_name: gemini-cli-local
    build:
      context: ./gemini-cli
      dockerfile: Dockerfile
    working_dir: /workspace
    entrypoint: []
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    volumes:
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ./.gemini:/home/node/.gemini:cached
      - .:/workspace:cached
    env_file:
      - .env.gemini
    profiles:
      - local
